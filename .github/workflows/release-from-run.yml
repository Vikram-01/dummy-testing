name: Release APK from a tested run

# Publishes the APK artifact of a run whose emulator smoke test passed,
# without rebuilding. The run id is read from .github/release-run-id.
on:
  push:
    branches: [vigil-release]

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - id: run
        run: echo "id=$(tr -d '[:space:]' < .github/release-run-id)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v5
        with:
          name: vigil-apk
          run-id: ${{ steps.run.outputs.id }}
          github-token: ${{ github.token }}
      - name: Publish release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv vigil-1.0.0.apk vigil-1.0.1.apk
          sha256sum vigil-1.0.1.apk > vigil-1.0.1.apk.sha256
          gh release create "vigil-v1.0.1" vigil-1.0.1.apk vigil-1.0.1.apk.sha256 \
            --repo "${{ github.repository }}" --target "${{ github.sha }}" --prerelease \
            --title "Vigil 1.0.1" \
            --notes "Fixes the startup crash in 1.0.0. This APK passed an emulator test: launch, first live sync, and every screen. Signed with the standard debug key for personal installs."
