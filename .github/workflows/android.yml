# Builds the Personal Finance 360 Android APKs on GitHub's servers (Android SDK preinstalled).
# Trigger: any push to this branch, or "Run workflow" in the Actions tab.
# Output: a GitHub pre-release with the APKs attached (phone-friendly download links) + workflow artifacts.
#
# Release signing: add these repository secrets (Settings → Secrets and variables → Actions):
#   PF360_KEYSTORE_BASE64   base64 of your release .jks / .keystore file
#   PF360_KEYSTORE_PASSWORD
#   PF360_KEY_ALIAS
#   PF360_KEY_PASSWORD
# Without them the release APK is built UNSIGNED and named "...-release-PENDING-SIGNING.apk".
name: Android APK

on:
  push:
    branches: [pf360-app]
    paths: ['mobile/**', 'backend/**', '.github/workflows/android.yml']
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: mobile/package-lock.json }
      - name: Install app dependencies
        working-directory: mobile
        run: npm ci
      - name: Typecheck, unit tests, on-device engine tests
        working-directory: mobile
        run: npm run test:all
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Backend tests
        working-directory: backend
        run: |
          pip install -q -r requirements.txt
          python -m pytest -q

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        variant: [debug, release]
    env:
      APP_VARIANT: ${{ matrix.variant }}
      EXPO_PUBLIC_DEMO_MODE: ${{ matrix.variant == 'debug' && '1' || '0' }}
      EXPO_PUBLIC_API_BASE_URL: ${{ vars.PF360_API_BASE_URL }}
      EXPO_NO_TELEMETRY: '1'
      CI: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: mobile/package-lock.json }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - name: Install dependencies
        working-directory: mobile
        run: npm ci
      - name: Generate native Android project
        working-directory: mobile
        run: npx expo prebuild --platform android --no-install --clean

      - name: Prepare release signing key
        id: sign
        if: matrix.variant == 'release'
        env:
          KS: ${{ secrets.PF360_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "PF360_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No signing secrets: release APK will be UNSIGNED (pending signing)."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build APK
        working-directory: mobile/android
        env:
          PF360_KEYSTORE_PASSWORD: ${{ secrets.PF360_KEYSTORE_PASSWORD }}
          PF360_KEY_ALIAS: ${{ secrets.PF360_KEY_ALIAS }}
          PF360_KEY_PASSWORD: ${{ secrets.PF360_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Name and verify APK
        id: apk
        run: |
          mkdir -p out
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          if [ "$APP_VARIANT" = "debug" ]; then
            cp mobile/android/app/build/outputs/apk/release/app-release.apk out/PersonalFinance360-debug.apk
          elif [ "${{ steps.sign.outputs.signed }}" = "true" ]; then
            cp mobile/android/app/build/outputs/apk/release/app-release.apk out/PersonalFinance360-release.apk
          else
            cp mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk out/PersonalFinance360-release-PENDING-SIGNING.apk
          fi
          for f in out/*.apk; do
            echo "== $f ($(du -h "$f" | cut -f1))"
            "$BT/aapt2" dump badging "$f" | grep -E "^package:|sdkVersion|targetSdkVersion|native-code" || true
            "$BT/apksigner" verify --print-certs "$f" 2>&1 | head -4 || echo "(unsigned)"
            sha256sum "$f" | tee "$f.sha256"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.variant }}
          path: out/*
          retention-days: 30

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Create pre-release with APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="pf360-build-${{ github.run_number }}"
          cat > notes.md <<EOF
          Personal Finance 360 — automated build #${{ github.run_number }} from \`${GITHUB_SHA::7}\`.

          - **PersonalFinance360-debug.apk** — install this to try the app. Package \`com.personalfinance360.app.debug\`, shown as "PF360 Debug". Runs fully on-device; includes optional fictional sample data (marked DEMO).
          - **PersonalFinance360-release(-PENDING-SIGNING).apk** — production variant (\`com.personalfinance360.app\`). If the name says PENDING-SIGNING it is unsigned and will not install until signed; see docs/SIGNING.md.

          SHA-256 checksums are attached.
          EOF
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "PF360 build #${{ github.run_number }}" --notes-file notes.md
