name: Build SecOpsDaily APK

on:
  push:
    branches: [vigil]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: secopsdaily-apk
  cancel-in-progress: true

env:
  CI: '1'
  EXPO_NO_TELEMETRY: '1'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx6g -XX:MaxMetaspaceSize=1g" -Dorg.gradle.daemon=false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        run: npm ci
      - name: Typecheck, lint and test
        run: |
          npx tsc --noEmit
          npx eslint src tests scripts
          npx jest
      - name: Generate native Android project
        run: |
          npx expo prebuild --platform android --no-install
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
      - name: Build release APK
        working-directory: android
        # x86_64 is included so the same APK can be smoke-tested on the CI emulator.
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a,x86_64 --stacktrace
      - name: Collect APK
        run: |
          cp "$(ls android/app/build/outputs/apk/release/*.apk | head -1)" secopsdaily-1.1.0.apk
          sha256sum secopsdaily-1.1.0.apk | tee secopsdaily-1.1.0.apk.sha256
      - uses: actions/upload-artifact@v5
        with:
          name: secopsdaily-apk
          path: |
            secopsdaily-1.1.0.apk
            secopsdaily-1.1.0.apk.sha256

  smoke-test:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: secopsdaily-apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash scripts/ci-smoke.sh
      - name: Publish logs to vigil-ci-logs branch
        if: always()
        run: |
          mkdir -p /tmp/logs && cp -r ci-logs/* /tmp/logs/ 2>/dev/null || true
          git config user.name "vigil-ci"
          git config user.email "vigil-ci@users.noreply.github.com"
          git checkout --orphan vigil-ci-logs
          git rm -rf --cached . > /dev/null
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r /tmp/logs/* . 2>/dev/null || echo "no logs" > NO_LOGS
          git add -A
          git commit -m "CI smoke-test logs for run ${{ github.run_id }}"
          git push -f origin HEAD:refs/heads/vigil-ci-logs
      - name: Fail if the app crashed
        # ci-logs/ is removed while publishing logs, so check the saved copy.
        run: grep -q PASS /tmp/logs/RESULT

  release:
    needs: smoke-test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: secopsdaily-apk
      - name: Publish release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="secopsdaily-v1.1.0-build${{ github.run_number }}"
          gh release create "$TAG" secopsdaily-1.1.0.apk secopsdaily-1.1.0.apk.sha256 \
            --repo "${{ github.repository }}" --target "${{ github.sha }}" --prerelease \
            --title "SecOpsDaily 1.1.0 (build ${{ github.run_number }})" \
            --notes "Android APK that passed an emulator launch test. Signed with the standard debug key for personal installs."
